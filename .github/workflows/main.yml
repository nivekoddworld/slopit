name: Deploy The Slopit

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the hub
        uses: actions/checkout@v4

      - name: Checkout minecraft-game
        uses: actions/checkout@v4
        with:
          repository: nivekoddworld/my-first-game
          path: src/minecraft-game

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build all slop
        run: |
          mkdir -p site
          for d in src/*/; do
            name=$(basename "$d")
            echo "::group::Building $name"
            (cd "$d" && npm ci && npm run build)
            cp -r "$d/dist" "site/$name"
            echo "::endgroup::"
          done

      - name: Generate index
        run: node build-index.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
